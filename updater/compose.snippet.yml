# The update sidecar, as a Compose override file for the project of the
# README's "Run it" section. Installed next to docker-compose.yml as
# docker-compose.override.yml, which `docker compose` reads automatically
# (updater/README.md, "Install"; tests/sidecar-docs.sh runs that recipe).
#
# /opt/unbound stands for the project directory. The install command replaces
# it with the real path: it must be the same on both sides of the bind mount
# (updater/README.md, "The same-absolute-path rule").
#
# The Docker socket is root on the host: read updater/README.md first.
services:
  unbound-autoupdate:
    image: esitcparis/unbound-autoupdate:1
    restart: unless-stopped
    # A stop during a swap lets the swap finish first (updater/README.md,
    # "Signals"); Docker's default 10 s would cut it short.
    stop_grace_period: 2m
    environment:
      INTERVAL: 1h
      # Healthchecks.io check URL: /start, success and /fail pings per cycle.
      # HC_URL: https://hc-ping.com/<uuid>
      # NOTIFY_HOST: resolver-1.example   # default: the Docker daemon's host name
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/unbound:/opt/unbound:ro
      - autoupdate-state:/var/lib/unbound-autoupdate

  unbound-metrics:
    image: esitcparis/unbound-autoupdate:1
    command: ["metrics"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9167:9167"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - autoupdate-state:/var/lib/unbound-autoupdate:ro

volumes:
  autoupdate-state:
