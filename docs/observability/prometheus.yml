# Scrape configuration for unbound-distroless hosts running the update
# sidecar's metrics service (updater/README.md, "Metrics"). One endpoint per
# host serves the resolver's statistics (unbound_*), the sidecar's state
# (unbound_autoupdate_*) and the scrape's own result (unbound_exporter_*).
#
# Each target is the address the host publishes /metrics on. The reference
# project (../production/docker-compose.yml) publishes it on 127.0.0.1 only:
# for a Prometheus on another host, publish it on the host's monitoring
# address instead, and put that address here.
#
# tests/observability.sh runs `promtool check config` on this file, which also
# checks alerts.yml.
scrape_configs:
  - job_name: unbound
    scrape_interval: 30s
    static_configs:
      - targets: ['resolver-1.example:9167', 'resolver-2.example:9167']

rule_files:
  - alerts.yml
