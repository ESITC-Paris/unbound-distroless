# Reference production Compose project: the resolver and the update sidecar.
# Documented in ../production.md; tests/sidecar-docs.sh validates it.
#
# Written for the project directory /opt/unbound. That path appears on BOTH
# sides of the sidecar's bind mount below, and must: the sidecar runs
# `docker compose` against these files from inside its container, and the
# Docker daemon applies the project's bind mounts on the host
# (updater/README.md, "The same-absolute-path rule"). Elsewhere, change
# /opt/unbound on both sides.
#
# HC_URL (and WEBHOOK_URL if used) come from a .env file next to this one.
name: unbound

services:
  unbound:
    # The sidecar pulls this tag every cycle and deploys what it moves to,
    # after a canary. To change the resolver only by hand, replace it with an
    # X.Y.Z-rN tag or a digest from the releases page
    # (../production.md, "What the resolver follows").
    image: esitcparis/unbound-distroless:1
    container_name: unbound
    restart: unless-stopped

    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # binding :53 as UID 65532
    security_opt: ["no-new-privileges:true"]

    # The image writes only to /var/lib/unbound (the volume below) and
    # /run/unbound (control socket, PID file).
    read_only: true
    tmpfs:
      - "/run/unbound:uid=65532,gid=65532"

    # All host addresses. Port 53 already in use: README.md, "Run it".
    ports:
      - "53:53/udp"
      - "53:53/tcp"

    volumes:
      # Named volume, required by the sidecar: it holds the DNSSEC trust
      # anchor and the root zone copy, and the canary runs on a copy of it.
      - unbound-data:/var/lib/unbound
      - ./unbound.conf:/etc/unbound/unbound.conf:ro
      # - ./tls:/etc/unbound/tls:ro

    # outgoing-range 4096 x num-threads 2 in unbound.conf = 8192 sockets for
    # the outgoing port pool alone.
    ulimits:
      nofile:
        soft: 16384
        hard: 16384

    # unbound.conf's caches add up to 240m (msg 64m, rrset 128m, key 32m,
    # neg 16m), before the infra cache and per-thread buffers. Change this
    # together with the cache sizes.
    deploy:
      resources:
        limits:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The Docker socket is root on the host: updater/README.md.
  unbound-autoupdate:
    image: esitcparis/unbound-autoupdate:1
    restart: unless-stopped
    # A stop during a swap lets the swap finish first (updater/README.md,
    # "Signals"); Docker's default 10 s would cut it short.
    stop_grace_period: 2m
    environment:
      INTERVAL: 1h
      SPLAY: 10%
      NOTIFY_HOST: resolver-1.example
      HC_URL: ${HC_URL:?set HC_URL in .env}
      # WEBHOOK_URL: ${WEBHOOK_URL:?set WEBHOOK_URL in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/unbound:/opt/unbound:ro
      - autoupdate-state:/var/lib/unbound-autoupdate
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  unbound-metrics:
    image: esitcparis/unbound-autoupdate:1
    command: ["metrics"]
    restart: unless-stopped
    ports:
      # Loopback only. For a Prometheus on another host, replace 127.0.0.1
      # with this host's address on the monitoring network: /metrics uses the
      # Docker socket and must not be reachable from anywhere else.
      - "127.0.0.1:9167:9167"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - autoupdate-state:/var/lib/unbound-autoupdate:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  unbound-data:
  autoupdate-state:
