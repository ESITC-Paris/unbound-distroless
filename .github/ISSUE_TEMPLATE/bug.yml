name: Bug
description: The image, the sidecar or the documentation does not do what it says.
labels: [bug]
body:
  - type: input
    id: image
    attributes:
      label: Image
      description: Tag and digest (`docker inspect -f '{{index .RepoDigests 0}}' <container>`).
      placeholder: esitcparis/unbound-distroless:1.2.3-r4 @ sha256:…
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: How it is run
      description: The `docker run` line or the Compose service, and any configuration changed from the shipped `unbound.conf`.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the commands you ran and their output, and the container logs (`docker logs`).
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: OS, architecture, Docker Engine and Compose versions (`docker version`, `docker compose version`).
    validations:
      required: true
