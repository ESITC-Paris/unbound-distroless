name: Upstream check

# Triggered hourly by an external scheduler (cron on ESITC infrastructure —
# see docs/operations.md) via the workflow_dispatch API. No GitHub `schedule`
# trigger on purpose: external dispatch is exempt from GitHub's 60-day
# inactivity auto-disable and is not subject to scheduler congestion delays.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung network call must not hold the concurrency group for the default
    # 6 hours: everything this job does normally completes in under a minute.
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA (trailing comment records the tag it came
      # from): this job pushes to main, tags, and dispatches the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load current pins
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Check latest Unbound release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticated so the shared runner IP's 60 req/h anonymous quota can't
          # flake the hourly check; retried so a transient 5xx can't either.
          # Release candidates (release-1.2.3rc1) are excluded by requiring the
          # closing quote right after the patch number.
          LATEST=$(curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/NLnetLabs/unbound/tags \
            | grep -oE '"name": *"release-[0-9]+\.[0-9]+\.[0-9]+"' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          [ -n "$LATEST" ] || { echo "could not determine latest version"; exit 1; }
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Current: ${UNBOUND_VERSION:-unset} — Latest: $LATEST"

      - name: Check base image digests
        id: digests
        run: |
          # Registry reads are retried: Docker Hub, gcr.io and ghcr.io
          # occasionally rate-limit or hiccup, and a red run every time would
          # be noise.
          resolve() {
            for _ in 1 2 3; do
              D=$(docker buildx imagetools inspect "$1" --format '{{println .Manifest.Digest}}' 2>/dev/null | head -1)
              [ -n "$D" ] && { echo "$D"; return 0; }
              sleep 10
            done
            return 1
          }
          DEBIAN=$(resolve debian:trixie) || { echo "debian digest resolution failed"; exit 1; }
          DISTROLESS=$(resolve gcr.io/distroless/base-debian13:nonroot) || { echo "distroless digest resolution failed"; exit 1; }
          ALPINE=$(resolve alpine:3.24) || { echo "alpine digest resolution failed"; exit 1; }
          COSIGN=$(resolve ghcr.io/sigstore/cosign/cosign:v2.6.5) || { echo "cosign digest resolution failed"; exit 1; }
          {
            echo "debian=$DEBIAN"
            echo "distroless=$DISTROLESS"
            echo "alpine=$ALPINE"
            echo "cosign=$COSIGN"
          } >> "$GITHUB_OUTPUT"

      - name: Decide action
        id: decide
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          NEW_DEBIAN: ${{ steps.digests.outputs.debian }}
          NEW_DISTROLESS: ${{ steps.digests.outputs.distroless }}
          NEW_ALPINE: ${{ steps.digests.outputs.alpine }}
          NEW_COSIGN: ${{ steps.digests.outputs.cosign }}
        run: |
          # The logic lives in a script so tests/monitor.sh can exercise it.
          bash .github/scripts/decide-updates.sh | tee -a "$GITHUB_OUTPUT"

      - name: Update pins for a new Unbound version
        if: steps.decide.outputs.action == 'version'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          # "NLnet Labs releases signing key G2 <releases@nlnetlabs.nl>" — the key
          # that signs NSD/Unbound/ldns tarballs published after 2026-01-01.
          # Fingerprint published at https://nlnetlabs.nl/signing-keys/ and
          # confirmed against the issuer-fpr subpacket of the 1.26.0 signature.
          UNBOUND_SIGNING_KEY: 231018690C4D903EF419146AA144323DEAACDF45
        run: |
          BASE=https://nlnetlabs.nl/downloads/unbound
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/unbound.tar.gz     "$BASE/unbound-${LATEST}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/unbound.tar.gz.asc "$BASE/unbound-${LATEST}.tar.gz.asc"

          # Fail-closed OpenPGP verification, before the hash is recorded: a
          # recorded hash is a trusted-forever pin, so it must never be minted
          # from an unverified download. The public key is vendored in the
          # repository (.github/keys/) — no keyserver dependency, no network
          # flake — and its fingerprint is pinned above, so whoever serves the
          # tarball cannot also supply the key that vouches for it. (Note:
          # keys.openpgp.org is NOT a viable fallback — it strips UIDs, which
          # GnuPG refuses to import.)
          GNUPGHOME=$(mktemp -d); export GNUPGHOME; chmod 700 "$GNUPGHOME"
          gpg --batch --import .github/keys/nlnetlabs-releases-g2.asc
          gpg --batch --with-colons --fingerprint | awk -F: '/^fpr:/ {print $10}' \
            | grep -qx "$UNBOUND_SIGNING_KEY" \
            || { echo "::error::imported key is not the pinned NLnet Labs signing key"; exit 1; }
          gpg --batch --verify /tmp/unbound.tar.gz.asc /tmp/unbound.tar.gz \
            || { echo "::error::OpenPGP verification of unbound-${LATEST}.tar.gz failed"; exit 1; }

          SHA=$(sha256sum /tmp/unbound.tar.gz | cut -d' ' -f1)

          # Cheap second opinion: upstream also publishes a .sha256 next to the
          # tarball. Disagreement means the two artefacts came from different
          # trees; refuse to pin either.
          PUBLISHED=$(curl -fsSL --retry 3 --retry-delay 5 "$BASE/unbound-${LATEST}.tar.gz.sha256" | tr -d '[:space:]')
          [ "$PUBLISHED" = "$SHA" ] \
            || { echo "::error::published .sha256 ($PUBLISHED) does not match the downloaded tarball ($SHA)"; exit 1; }

          # versions.env must stay comment-free KEY=VALUE: ci.yml and release.yml
          # cat it straight into $GITHUB_ENV.
          # In place, key by key: versions.env also carries the sidecar's own
          # version and revision, which a resolver bump must not touch.
          sed -i -e "s/^UNBOUND_VERSION=.*/UNBOUND_VERSION=$LATEST/" \
                 -e "s/^UNBOUND_SHA256=.*/UNBOUND_SHA256=$SHA/" \
                 -e "s/^REVISION=.*/REVISION=0/" versions.env
          cat versions.env >> "$GITHUB_ENV"

      - name: Bump revision for dependency updates
        if: steps.decide.outputs.action == 'revision'
        run: |
          NEWREV=$((REVISION + 1))
          sed -i "s/^REVISION=.*/REVISION=$NEWREV/" versions.env
          echo "REVISION=$NEWREV" >> "$GITHUB_ENV"

      - name: Bump the sidecar revision for base updates
        if: steps.decide.outputs.updater_action == 'revision'
        run: |
          NEWREV=$((UPDATER_REVISION + 1))
          sed -i "s/^UPDATER_REVISION=.*/UPDATER_REVISION=$NEWREV/" versions.env
          echo "UPDATER_REVISION=$NEWREV" >> "$GITHUB_ENV"

      - name: Commit state, tag, and dispatch releases
        if: steps.decide.outputs.action != 'none' || steps.decide.outputs.updater_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.decide.outputs.action }}
          UPDATER_ACTION: ${{ steps.decide.outputs.updater_action }}
          NEW_DEBIAN: ${{ steps.digests.outputs.debian }}
          NEW_DISTROLESS: ${{ steps.digests.outputs.distroless }}
          NEW_ALPINE: ${{ steps.digests.outputs.alpine }}
          NEW_COSIGN: ${{ steps.digests.outputs.cosign }}
        run: |
          # shellcheck disable=SC1091
          . ./versions.env
          printf '{\n  "debian": "%s",\n  "distroless": "%s",\n  "alpine": "%s",\n  "cosign": "%s"\n}\n' \
            "$NEW_DEBIAN" "$NEW_DISTROLESS" "$NEW_ALPINE" "$NEW_COSIGN" > .build-state.json
          TAGS=()
          [ "$ACTION" != none ] && TAGS+=("v${UNBOUND_VERSION}-r${REVISION}")
          [ "$UPDATER_ACTION" != none ] && TAGS+=("updater-v${UPDATER_VERSION}-r${UPDATER_REVISION}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.env .build-state.json
          git commit -m "chore: ${TAGS[*]} (resolver: ${ACTION}, sidecar: ${UPDATER_ACTION}) [skip ci]"
          for t in "${TAGS[@]}"; do git tag "$t"; done
          # --atomic so a rejected main (someone else pushed first) cannot leave
          # a tag behind on the remote: a stranded tag would make every later
          # run fail with "already exists" until a human deletes it. Push only
          # these tags, never --tags.
          git push --atomic origin main "${TAGS[@]}"
          # A tag pushed with GITHUB_TOKEN does not trigger workflows, so each
          # release has to be dispatched explicitly against its tag. The push
          # already happened, so a failed dispatch would otherwise mean a silent,
          # permanent missed release (the next run sees none/none). Retry, then
          # fail the job so the miss is visible in the Actions UI.
          failed=""
          for t in "${TAGS[@]}"; do
            case "$t" in updater-v*) wf=updater.yml ;; *) wf=release.yml ;; esac
            ok=0
            for i in 1 2 3 4 5; do
              if gh workflow run "$wf" --ref "$t" -f tag="$t"; then ok=1; break; fi
              echo "dispatch of $wf for $t: attempt $i failed; retrying in 15s"
              sleep 15
            done
            [ "$ok" = 1 ] || failed="$failed $wf:$t"
          done
          if [ -n "$failed" ]; then
            echo "::error::release dispatch failed after 5 attempts for:$failed — run manually: gh workflow run <workflow> --ref <tag> -f tag=<tag>"
            exit 1
          fi

      - name: Notify admin on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue per problem, assigned to the admin (guaranteed email /
          # mobile notification). Repeated failures add comments to the same
          # issue instead of flooding the tracker.
          TITLE="Upstream check is failing"
          NUM=$(gh issue list --state open --json number,title \
            -q ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          BODY="The scheduled upstream check failed. Investigate: $RUN_URL"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --assignee euca01 --body "$BODY"
          fi
