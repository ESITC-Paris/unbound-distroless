name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/superpowers/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/superpowers/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lint tools run as digest-pinned container images (same immutability
      # policy as SHA-pinned actions).
      - name: hadolint (Dockerfile)
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

      - name: hadolint (updater/Dockerfile)
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < updater/Dockerfile

      - name: shellcheck (every shell source)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine@sha256:c82fe42504fbc9fc68f15d36638e5ee2324ebb8b94e96a3c4e395bf361c49183 \
            shellcheck -S warning \
              tests/structure.sh tests/functional.sh tests/updater.sh tests/updater/lib.sh tests/monitor.sh \
              updater/unbound-autoupdate updater/entrypoint.sh updater/lib/*.sh updater/www/cgi-bin/metrics \
              .github/scripts/decide-updates.sh

      - name: Monitor decision logic
        run: bash tests/monitor.sh

      - name: promtool (alert rules)
        run: |
          docker run --rm -v "$PWD/docs/observability:/obs:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /obs/alerts.yml

      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Every action is pinned to a full commit SHA (the trailing comment records
      # the tag that SHA was resolved from). A moving tag is a mutable dependency
      # that runs with the job's token; a SHA is not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Load pinned base image digests
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          state = json.load(open('.build-state.json'))
          print(f"DEBIAN_BASE=debian:trixie@{state['debian']}")
          print(f"DISTROLESS_BASE=gcr.io/distroless/base-debian13:nonroot@{state['distroless']}")
          PY

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: unbound-distroless:test
          build-args: |
            UNBOUND_VERSION=${{ env.UNBOUND_VERSION }}
            UNBOUND_SHA256=${{ env.UNBOUND_SHA256 }}
            DEBIAN_BASE=${{ env.DEBIAN_BASE }}
            DISTROLESS_BASE=${{ env.DISTROLESS_BASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Structure tests
        run: bash tests/structure.sh unbound-distroless:test

      - name: Install dig
        run: command -v dig >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq bind9-dnsutils)

      - name: Functional tests
        run: bash tests/functional.sh unbound-distroless:test

      - name: Trivy vulnerability scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: unbound-distroless:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Load pinned base image digests
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          state = json.load(open('.build-state.json'))
          print(f"ALPINE_BASE=alpine:3.24@{state['alpine']}")
          print(f"COSIGN_IMAGE=ghcr.io/sigstore/cosign/cosign:v3.1.3@{state['cosign']}")
          PY

      - name: Build the sidecar image
        run: |
          docker build -t unbound-autoupdate:test \
            --build-arg "ALPINE_BASE=$ALPINE_BASE" \
            --build-arg "COSIGN_IMAGE=$COSIGN_IMAGE" \
            --build-arg "UPDATER_VERSION=${UPDATER_VERSION}-r${UPDATER_REVISION}" \
            updater/

      # The suite drives real containers, real DNS, real cosign verification
      # against published images and a throwaway registry. It is the gate
      # that would have caught the tag-mismatch defect of the retired
      # host-side updater.
      - name: Integration tests
        run: bash tests/updater.sh unbound-autoupdate:test

      # Trivy policy for the sidecar, split by package origin because the two
      # halves of this image have different remediation paths:
      #   * Alpine packages are ours to fix — `apk upgrade` at build time pulls
      #     whatever Alpine has published, so they must be clean at HIGH.
      #   * /usr/local/bin/cosign is a vendored, digest-pinned upstream Go
      #     binary. Its findings are in cosign's own Go dependencies: the fix
      #     exists upstream in Go, but only a new cosign build can ship it, so
      #     nothing in this repository can clear them. No cosign release is
      #     free of them — v3.1.3, the newest, still carries 16 HIGH (0
      #     CRITICAL). Gating it at HIGH would mean a permanently red pipeline
      #     or a blanket ignore file; instead it is gated at CRITICAL and
      #     tracked to the newest upstream release (.build-state.json +
      #     upstream-check.yml).
      - name: 'Trivy: OS packages (gate)'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: unbound-autoupdate:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: usr/local/bin/cosign

      - name: 'Trivy: whole image incl. vendored cosign (gate)'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: unbound-autoupdate:test
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
