name: Scorecard

# OpenSSF Scorecard: an outside, repeatable assessment of the repository's
# supply-chain practices, published to api.scorecard.dev and to code scanning.
#
# The one `schedule` trigger in this repository, on purpose. The no-schedule
# rule exists for the release path (scheduler delays, the 60-day inactivity
# auto-disable — see upstream-check.yml); Scorecard is not release-critical,
# so a late or disabled run costs nothing but a stale score. And it needs a
# clock: the bot's commits carry [skip ci], so a push trigger alone would
# leave the score stale between human changes.
#
# Publishing results constrains this file (enforced by the Scorecard API):
# no workflow-level env, defaults or write permissions; the job may only use
# the actions below, no `run:` steps, no job-level env.
on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Sign the published results (publish_results: true).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
