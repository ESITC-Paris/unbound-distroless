# unbound-distroless — the Compose file of the README's "Run it" section, with
# its comments. tests/quickstart.sh checks that the README prints this same
# project, starts it (only the image, the container name and the published
# host port are overridden) and checks resolution and DNSSEC.
#
# As shipped it serves this host only (127.0.0.1). To serve a network, put
# the host's address on that network in the two `ports:` lines — an address,
# not all of them: README, "Serving your network".
#
# Production: replace the tag below with an X.Y.Z-rN tag or an @sha256:
# digest taken from https://github.com/ESITC-Paris/unbound-distroless/releases
# (or keep `:1` and add the update sidecar: updater/README.md).
services:
  unbound:
    image: esitcparis/unbound-distroless:1
    container_name: unbound
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # binding :53 as UID 65532 (docs/usage.md#port-53-and-capabilities)
    security_opt: ["no-new-privileges:true"]
    # The image writes only to /var/lib/unbound (volume below) and
    # /run/unbound (control socket, PID file).
    read_only: true
    tmpfs:
      - "/run/unbound:uid=65532,gid=65532"
    ports:
      # One named address, never "53:53": behind Docker's port publishing any
      # client can appear to Unbound as the Docker bridge, which the shipped
      # access-control allows — on a host with a public address that is an
      # open resolver.
      - "127.0.0.1:53:53/udp"   # this host only: see "Serving your network"
      - "127.0.0.1:53:53/tcp"
    volumes:
      # DNSSEC trust anchor (RFC 5011 updates) and the hyperlocal root zone copy.
      # Named unbound-rootkey in versions of this file before 2026-11: keep that
      # name here if you replace an old file, or the anchor state starts over.
      - unbound-data:/var/lib/unbound
      # Your own configuration, once you have one (README, "Configuration"):
      # - ./unbound.conf:/etc/unbound/unbound.conf:ro
    ulimits:
      # outgoing-range 4096 x num-threads 2 in the shipped unbound.conf.
      nofile:
        soft: 16384
        hard: 16384

volumes:
  unbound-data:
