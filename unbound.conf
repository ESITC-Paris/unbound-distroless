# ══════════════════════════════════════════════════════════════════════════════
# unbound.conf — default configuration shipped with unbound-distroless
# ══════════════════════════════════════════════════════════════════════════════
#
# A hardened, DNSSEC-validating, caching DNS resolver with defaults safe for
# any host. It works out of the box for LAN/homelab/enterprise-internal use.
#
# HOW TO CUSTOMIZE
#   1. Copy this file and edit it (every directive below explains when and how
#      to change it — commented example blocks are at the end).
#   2. Validate it (the image has no shell, call the binary directly):
#        docker run --rm -v /path/to/unbound.conf:/etc/unbound/unbound.conf:ro \
#          --entrypoint /usr/local/sbin/unbound-checkconf \
#          esitcparis/unbound-distroless:latest /etc/unbound/unbound.conf
#   3. Mount it over the default:
#        -v /path/to/unbound.conf:/etc/unbound/unbound.conf:ro
#   4. Restart the container. Full docs: `man unbound.conf` or
#      https://unbound.docs.nlnetlabs.nl/
#
# PATHS THAT MUST NOT CHANGE (they match the image layout):
#   /etc/unbound/root.hints      root server hints (baked at build)
#   /var/lib/unbound/root.key    DNSSEC trust anchor (auto-updated, RFC 5011)
#   /var/lib/unbound/root.zone   hyperlocal root zone copy (auto-updated)
#   /run/unbound/unbound.ctl     control socket (used by the healthcheck)
#   /run/unbound/unbound.pid     PID file

server:

  # ── Listening ────────────────────────────────────────────────────────────────
  # Listen on all container interfaces, IPv4 and IPv6, standard DNS port.
  # Scope exposure with Docker itself (-p 127.0.0.1:53:53 or -p <lan-ip>:53:53)
  # rather than narrowing these; inside the container "all interfaces" is right.
  # Binding a port below 1024 as non-root works thanks to the
  # cap_net_bind_service file capability set on the binary at build — that also
  # covers 853 (DoT) and 443 (DoH) if you enable them (examples at the end).
  interface: 0.0.0.0
  interface: ::0
  port: 53

  # Lets each worker thread own its listening socket (kernel load-balances
  # between them). Keep on; only disable on exotic kernels without SO_REUSEPORT.
  so-reuseport: yes

  # ── Container environment ────────────────────────────────────────────────────
  # The process already runs as UID 65532 (nonroot) inside a distroless image,
  # so the classic drop-privileges and chroot dance is unnecessary — the
  # container boundary does that job. Leave these three alone.
  username: ""
  chroot: ""
  pidfile: "/run/unbound/unbound.pid"

  # ── Logging ──────────────────────────────────────────────────────────────────
  # Logs go to stderr (empty logfile + no syslog), i.e. straight to
  # `docker logs` / your container log collector.
  use-syslog: no
  logfile: ""

  # 0 = errors only, 1 = operational info (default), 2+ = increasingly chatty
  # debugging. Use 2 or 3 temporarily when diagnosing resolution problems.
  verbosity: 1

  # Per-query logging is off: it is expensive and privacy-sensitive. Turn
  # log-queries/log-replies on only for short debugging sessions.
  log-queries: no
  log-replies: no

  # Do log the reason whenever a client receives SERVFAIL — invaluable for
  # diagnosing DNSSEC or upstream reachability issues at zero steady-state cost.
  log-servfail: yes

  # ── Access control: who may query this resolver ──────────────────────────────
  # Default policy: answer private networks only — never an open resolver
  # (open resolvers get abused for DDoS amplification within hours).
  # Matching is longest-prefix (like a routing table), so order is irrelevant.
  # Actions: allow = answer recursively; refuse = reply REFUSED (polite, fast);
  # deny = drop silently (prefer refuse: clients fail fast instead of timing out).
  #
  # To serve additional networks (e.g. a VPN or CGNAT range), add lines like:
  #   access-control: 100.64.0.0/10 allow
  access-control: 127.0.0.0/8    allow
  access-control: 10.0.0.0/8     allow
  access-control: 172.16.0.0/12  allow
  access-control: 192.168.0.0/16 allow
  access-control: ::1/128        allow
  access-control: fd00::/8       allow
  access-control: fe80::/10      allow
  access-control: 0.0.0.0/0      refuse
  access-control: ::0/0          refuse

  # ── DNS rebinding protection ─────────────────────────────────────────────────
  # Strip private addresses from PUBLIC recursive answers: a public domain that
  # suddenly resolves to 192.168.x.x is a classic browser-based attack on your
  # internal network. If some of your legitimate internal zones resolve to
  # private addresses through recursion, whitelist them:
  #   private-domain: "corp.example"
  # (local-zone/local-data entries are NOT affected — only recursive answers.)
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10

  # ── Threads and slabs ────────────────────────────────────────────────────────
  # num-threads: set to the number of CPU cores available to the container
  # (2 is a safe default for small hosts). The *-slabs values partition each
  # cache to reduce lock contention: keep them a power of two >= num-threads
  # (e.g. num-threads: 8 → slabs: 8 or 16).
  num-threads: 2
  msg-cache-slabs: 4
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-slabs: 4

  # ── Caches ───────────────────────────────────────────────────────────────────
  # Sizes are per-cache totals, safe for small hosts. For a dedicated resolver,
  # scale with RAM and keep rrset ≈ 2 × msg (e.g. 8 GB host: msg 512m, rrset 1g,
  # key 128m, neg 64m). More cache = more answers served locally.
  msg-cache-size: 64m        # complete responses
  rrset-cache-size: 128m     # individual record sets
  key-cache-size: 32m        # DNSSEC keys
  neg-cache-size: 16m        # negative (NXDOMAIN/NODATA) answers

  # How many upstream servers to remember performance data about.
  infra-cache-numhosts: 50000

  # Clamp TTLs: cap at 1 day (86400) so stale records cannot linger for weeks.
  # cache-min-ttl: 0 respects zone owners' TTLs exactly (RFC-compliant).
  # Raising min-ttl (e.g. 60) trades freshness for fewer upstream queries —
  # do that knowingly, some zones rely on short TTLs for failover.
  cache-max-ttl: 86400
  cache-min-ttl: 0

  # ── Resilience: serve stale while refreshing ─────────────────────────────────
  # If an upstream is unreachable, keep answering from expired cache for up to
  # a day (serve-expired-ttl) while retrying in the background — your DNS keeps
  # working through upstream outages. Clients get the stale answer with a short
  # 30 s TTL so they re-ask soon. client-timeout: wait up to 1.8 s for a fresh
  # answer before falling back to the stale one.
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-reply-ttl: 30
  serve-expired-ttl-reset: yes
  serve-expired-client-timeout: 1800

  # Refresh popular records shortly BEFORE they expire (and their DNSSEC keys),
  # so hot names never miss the cache.
  prefetch: yes
  prefetch-key: yes

  # ── Transport ────────────────────────────────────────────────────────────────
  do-udp: yes
  do-tcp: yes

  # 1232 bytes is the DNS-flag-day-2020 consensus: avoids IP fragmentation
  # (a security and reliability hazard); larger answers fall back to TCP.
  # Do not raise this.
  edns-buffer-size: 1232
  max-udp-size: 1232

  # Concurrency budget per thread and outgoing port pool. Defaults suit small
  # and medium deployments; for heavy traffic raise both together and give the
  # container a higher open-files limit (--ulimit nofile=65535:65535), or
  # Unbound will log that it reduced them.
  num-queries-per-thread: 2048
  outgoing-range: 4096

  # TCP pipes: outgoing to upstreams, incoming from clients (raise incoming if
  # you serve many DoT/TCP clients).
  outgoing-num-tcp: 32
  incoming-num-tcp: 128

  # Keep idle client TCP connections open a while (reduces handshake churn).
  edns-tcp-keepalive: yes

  # Kernel socket buffers to absorb traffic bursts. The container cannot raise
  # kernel limits itself: without `sysctl -w net.core.rmem_max=4194304` (and
  # wmem_max) on the HOST you will see a harmless "was not granted" warning at
  # startup and run with the kernel's smaller value. Set both to 0 to silence
  # the warning and just use system defaults.
  so-rcvbuf: 4m
  so-sndbuf: 4m

  # ── Root hints and DNSSEC validation ─────────────────────────────────────────
  # Where to find the root servers (baked at build, refreshed at every rebuild).
  root-hints: "/etc/unbound/root.hints"

  # RFC 5011 auto-updating trust anchor — Unbound rewrites this file itself.
  # Mount /var/lib/unbound as a volume so it persists (see README).
  auto-trust-anchor-file: "/var/lib/unbound/root.key"

  # The processing pipeline. Every answer passes DNSSEC validation.
  # If you enable the shared Valkey/Redis cache, this becomes
  # "validator cachedb iterator" (see the example at the end).
  module-config: "validator iterator"

  # Validation behavior: strict (permissive-mode: no → bogus answers are
  # refused with SERVFAIL, not handed to clients), log validation failures
  # (val-log-level: 1), scrub unvalidated additional data, and participate in
  # root-key rollover telemetry (signaling/sentinel — harmless, helps IANA).
  val-clean-additional: yes
  val-permissive-mode: no
  val-log-level: 1
  trust-anchor-signaling: yes
  root-key-sentinel: yes

  # Use DNSSEC NSEC proofs to synthesize NXDOMAIN locally (RFC 8198): fewer
  # upstream queries, instant answers for non-existent names, dampens random
  # subdomain attacks.
  aggressive-nsec: yes

  # ── Hardening ────────────────────────────────────────────────────────────────
  # Each of these rejects a class of malformed or malicious data. Keep them on;
  # they are listed here so you know what protection you would lose.
  harden-glue: yes               # only trust glue records within the serving zone
  harden-dnssec-stripped: yes    # refuse answers whose DNSSEC data was stripped
  harden-below-nxdomain: yes     # names below a proven NXDOMAIN do not exist
  harden-algo-downgrade: yes     # no falling back to weaker DNSSEC algorithms
  harden-large-queries: yes      # drop abnormally large queries
  harden-short-bufsize: yes      # drop queries advertising a tiny EDNS buffer

  # DNS 0x20: randomize query-name letter case as an anti-spoofing check.
  # Strong protection, but the single most likely cause of "some domains
  # SERVFAIL" against rare non-compliant authoritative servers — if that
  # happens, set this to no first.
  use-caps-for-id: yes

  # If this many unsolicited replies arrive, assume we are under a poisoning
  # attempt and flush relevant cache.
  unwanted-reply-threshold: 10000000

  # Never send recursion upstream to localhost (loop protection). Set to no
  # only if you deliberately forward to a stub listening on 127.0.0.1.
  do-not-query-localhost: yes

  # Refuse ANY queries (the classic amplification vector; nothing legitimate
  # needs them).
  deny-any: yes

  # ── Privacy ──────────────────────────────────────────────────────────────────
  hide-identity: yes             # don't answer id.server/hostname.bind probes
  hide-version: yes              # don't reveal the software version
  qname-minimisation: yes        # send upstream servers only the labels they need (RFC 9156)
  minimal-responses: yes         # no unnecessary records in answers (smaller, safer)
  rrset-roundrobin: yes          # rotate A/AAAA order between answers (cheap load spreading)

  # ── Statistics ───────────────────────────────────────────────────────────────
  # No periodic log dumps (interval 0); counters accumulate and are fetched on
  # demand — cache hit rate, query types, response codes and more:
  #   docker exec <name> /usr/local/sbin/unbound-control \
  #     -c /etc/unbound/unbound.conf stats_noreset
  statistics-interval: 0
  statistics-cumulative: yes
  extended-statistics: yes

# ── Hyperlocal root zone (RFC 8806) ──────────────────────────────────────────
# Serve a local copy of the root zone for the resolver's own iteration:
# faster lookups (no round-trips to root servers), instant NXDOMAIN for
# non-existent TLDs, and less query metadata leaked to the roots.
# The image ships a build-time copy at the zonefile path; Unbound then keeps
# it fresh itself via AXFR/IXFR per the zone's SOA timers and persists it in
# /var/lib/unbound (mount that volume to keep it across recreations).
# All answers still go through normal DNSSEC validation, and fallback-enabled
# means plain recursion takes over if the local copy is stale or transfers
# fail — this can only make things faster, never break resolution.
# Verify it is live: unbound-control list_auth_zones  →  ". <serial>".
auth-zone:
  name: "."
  primary: 199.9.14.201         # b.root-servers.net
  primary: 192.33.4.12          # c.root-servers.net
  primary: 192.5.5.241          # f.root-servers.net
  primary: 192.112.36.4         # g.root-servers.net
  primary: 193.0.14.129         # k.root-servers.net
  primary: 192.0.47.132         # xfr.cjr.dns.icann.org
  primary: 192.0.32.132         # xfr.lax.dns.icann.org
  primary: 2001:500:200::b      # b.root-servers.net
  primary: 2001:500:2::c        # c.root-servers.net
  primary: 2001:500:2f::f       # f.root-servers.net
  primary: 2001:500:12::d0d     # g.root-servers.net
  primary: 2001:7fd::1          # k.root-servers.net
  primary: 2620:0:2830:202::132 # xfr.cjr.dns.icann.org
  primary: 2620:0:2d0:202::132  # xfr.lax.dns.icann.org
  fallback-enabled: yes
  for-downstream: no
  for-upstream: yes
  zonefile: "/var/lib/unbound/root.zone"

remote-control:
  # Local Unix socket only: no TLS certificates, no network exposure.
  # Used by the container HEALTHCHECK (`unbound-control status`) and for
  # admin commands via `docker exec` (status, stats_noreset, flush_zone,
  # list_auth_zones, reload, ...).
  control-enable: yes
  control-interface: /run/unbound/unbound.ctl

# ══════════════════════════════════════════════════════════════════════════════
# COMMENTED EXAMPLES — copy into your own config and adapt
# ══════════════════════════════════════════════════════════════════════════════
#
# ── Serve your internal zone ──────────────────────────────────────────────────
# Static names answered locally, never sent upstream. Add private-domain if
# subdomains of the zone also resolve to private addresses via recursion.
#
# server:
#   private-domain: "corp.example"
#   local-zone: "corp.example." static
#   local-data: "nas.corp.example.     IN A 192.168.1.10"
#   local-data: "printer.corp.example. IN A 192.168.1.20"
#   local-data-ptr: "192.168.1.10 nas.corp.example"
#
# ── Delegate an internal zone to another DNS server (e.g. AD, Pi-hole) ────────
#
# server:
#   private-domain: "ad.corp.example"
#   domain-insecure: "ad.corp.example"   # if the internal zone is unsigned
# stub-zone:
#   name: "ad.corp.example"
#   stub-addr: 192.168.1.5
#
# ── Forward everything to public DoT resolvers instead of full recursion ──────
# Trades independence for having an upstream party; queries are TLS-encrypted.
#
# server:
#   tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
# forward-zone:
#   name: "."
#   forward-tls-upstream: yes
#   forward-addr: 9.9.9.9@853#dns.quad9.net
#   forward-addr: 1.1.1.1@853#cloudflare-dns.com
#
# ── Serve DNS-over-TLS (DoT) to your clients on port 853 ──────────────────────
# Mount your certificate/key and publish the port:
#   -v /path/to/tls:/etc/unbound/tls:ro -p 853:853/tcp
#
# server:
#   interface: 0.0.0.0@853
#   tls-service-key: "/etc/unbound/tls/server.key"
#   tls-service-pem: "/etc/unbound/tls/server.pem"
#
# ── Serve DNS-over-HTTPS (DoH) on port 443 (endpoint /dns-query) ──────────────
#   -v /path/to/tls:/etc/unbound/tls:ro -p 443:443/tcp
#
# server:
#   interface: 0.0.0.0@443
#   https-port: 443
#   tls-service-key: "/etc/unbound/tls/server.key"
#   tls-service-pem: "/etc/unbound/tls/server.pem"
#
# ── Shared cache across replicas with Valkey/Redis (clustering) ───────────────
# One cache miss warms the whole fleet; replicas restart warm. Replace the
# module-config in the server section above (do not add a second one).
#
# server:
#   module-config: "validator cachedb iterator"
# cachedb:
#   backend: "redis"
#   redis-server-host: valkey.dns.svc.cluster.local
#   redis-server-port: 6379
#   redis-expire-records: yes
